<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL // ACCESO RESTRINGIDO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .terminal-container {
            width: 90%;
            max-width: 600px;
            background: #0d0d0d;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            padding: 30px;
            border-radius: 5px;
        }

        h1 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        p {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #88cc99;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            font-size: 1rem;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input[type="text"]::placeholder {
            color: #00441b;
        }

        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        button:hover {
            background: #00cc52;
        }

        .user-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .user-btn {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .user-btn:hover {
            background: #00ff66;
            color: #000;
        }

        .hidden {
            display: none;
        }

        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            font-size: 0.95rem;
            min-height: 50px;
        }

        .error {
            color: #ff3333;
        }

        .success {
            color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }

        #greeting {
            color: #00ffff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Botón de la H azul brillante en el título */
        .blue-h-btn {
            background: #001a33;
            color: #00bfff;
            border: 1px solid #00bfff;
            padding: 5px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.3);
            border-radius: 3px;
            transition: all 0.2s;
        }

        .blue-h-btn:hover {
            background: #00bfff;
            color: #000;
        }

        /* Botón secreto en la esquina */
        #secret-dot {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 15px;
            height: 15px;
            background: transparent;
            border: none;
            color: #112211; 
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 10px;
        }

        #secret-dot:hover {
            color: #00ff66;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <!-- PANTALLA 1: SELECCIÓN DE USUARIO -->
        <div id="selectionScreen">
            <h1>
                <span>[ IDENTIFICACIÓN ]</span>
                <!-- Aquí pusimos la H azul bien visible como un botón interactivo -->
                <button class="blue-h-btn" onclick="lanzarRickroll()" title="Pícale aquí">[H]</button>
            </h1>
            <p>Selecciona tu perfil de agente para iniciar el protocolo de acceso:</p>
            <div class="user-buttons">
                <button class="user-btn" onclick="seleccionarUsuario('Cristopher')">&gt; Cristopher</button>
                <button class="user-btn" onclick="seleccionarUsuario('Dylan')">&gt; Dylan</button>
                <button class="user-btn" onclick="seleccionarUsuario('Víctor')">&gt; Víctor</button>
                <button class="user-btn" onclick="seleccionarUsuario('Jazi')">&gt; Jazi</button>
            </div>
        </div>

        <!-- PANTALLA 2: TERMINAL (OCULTA AL INICIO) -->
        <div id="terminalScreen" class="hidden">
            <h1>[ SISTEMA DE VERIFICACIÓN DE ACCESO ]</h1>
            <div id="greeting"></div>
            <p id="customMessage" style="color: #ffaa00; font-style: italic; margin-bottom: 15px;"></p>
            <p>Introduce la secuencia obtenida en los fragmentos físicos para descifrar el mensaje final.</p>
            
            <div class="input-group">
                <input type="text" id="codeInput" placeholder="INGRESA EL CÓDIGO...">
                <button onclick="verificarCodigo()">EJECUTAR</button>
            </div>

            <div id="output"></div>
        </div>
    </div>

    <!-- BOTÓN ESCONDIDO EN LA ESQUINITA -->
    <button id="secret-dot" onclick="revelarSecreto()" title=".">.</button>

    <script>
        const codigoSecreto = "8Ñ-3O-X9"; 
        const mensajeSecreto = "ACCESO CONCEDIDO.\n\nsoy novio de mia la de la escolta gracias por participar";
        const rickrollUrl = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        let usuarioActual = "";

        function lanzarRickroll() {
            window.location.href = rickrollUrl;
        }

        function seleccionarUsuario(nombre) {
            usuarioActual = nombre;
            const customMsg = document.getElementById('customMessage');

            if (nombre === 'Jazi') {
                alert("MENTIROSO");
                window.location.href = "https://www.google.com";
                return;
            }

            document.getElementById('selectionScreen').classList.add('hidden');
            document.getElementById('terminalScreen').classList.remove('hidden');
            document.getElementById('greeting').innerText = `>> AGENTE RECONOCIDO: ${usuarioActual.toUpperCase()}`;

            if (nombre === 'Cristopher') {
                customMsg.innerText = ">> REGISTRO: \"no pense que lo lograrias bueno... realmente si lo pense\"";
            } else if (nombre === 'Dylan') {
                customMsg.innerText = ">> REGISTRO: \"creo que es obvio que pusiste el codigo por que christopher lo resolvió\"";
            } else if (nombre === 'Víctor') {
                customMsg.innerText = ">> REGISTRO: \"supongo que christopher ya lo resolvio\"";
            } else if (nombre === 'Acceso Maestro') {
                customMsg.innerText = ">> MODO ADMINISTRADOR SECRETO ACTIVADO.";
            }
        }

        function verificarCodigo() {
            const input = document.getElementById('codeInput').value.trim();
            const output = document.getElementById('output');

            if (input === "") {
                output.className = "error";
                output.innerText = "> ERROR: El campo no puede estar vacío.";
                return;
            }

            if (input.toUpperCase() === codigoSecreto.toUpperCase()) {
                output.className = "success";
                output.innerText = "> " + mensajeSecreto;
            } else {
                output.className = "error";
                output.innerText = `> ACCESO DENEGADO para ${usuarioActual}. Secuencia incorrecta. Vuelve a intentarlo cuando tengas todas las piezas.`;
            }
        }

        function revelarSecreto() {
            alert("o eres Jazi o lo descubriste");
            seleccionarUsuario('Acceso Maestro');
        }

        document.getElementById("codeInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarCodigo();
            }
        });
    </script>

</body>
</html>
